<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather App</title>
    <style>
      :root {
        --bg: #f3f7ff;
        --panel: rgba(255, 255, 255, 0.85);
        --card: #eaf2ff;
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #dbe7ff;
        --shadow: 0 16px 38px rgba(37, 99, 235, 0.12);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #dfeeff 0%, #f8fbff 35%, #edf5ff 100%);
        color: var(--text);
      }

      .app {
        width: min(92vw, 560px);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 28px 22px 20px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(8px);
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(2rem, 6vw, 2.7rem);
        text-align: center;
      }

      .search-row {
        display: flex;
        gap: 10px;
        margin-bottom: 18px;
      }

      input, button {
        font-size: 1rem;
        border-radius: 12px;
      }

      input {
        flex: 1;
        padding: 14px 16px;
        border: 1px solid var(--border);
        background: #fff;
        color: var(--text);
        outline: none;
      }

      input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
      }

      button {
        background: var(--primary);
        color: white;
        border: none;
        padding: 14px 18px;
        cursor: pointer;
        font-weight: 700;
        transition: background 0.2s ease, transform 0.2s ease;
      }

      button:hover {
        background: var(--primary-dark);
        transform: translateY(-1px);
      }

      #o {
        min-height: 190px;
      }

      .weather-card {
        padding: 18px;
        border-radius: 18px;
        background: var(--card);
        border: 1px solid var(--border);
      }

      .city {
        margin: 0 0 8px;
        font-size: clamp(1.3rem, 4vw, 1.9rem);
      }

      .temp {
        margin: 0;
        font-size: clamp(2.4rem, 8vw, 4rem);
        font-weight: 800;
      }

      .meta {
        margin: 12px 0 18px;
        color: var(--muted);
        font-size: 0.98rem;
      }

      .forecast {
        margin: 0;
        display: grid;
        gap: 8px;
      }

      .forecast-item {
        display: flex;
        justify-content: space-between;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.4);
        border: 1px solid rgba(147, 197, 253, 0.35);
      }

      .status {
        text-align: center;
        color: var(--muted);
        padding: 18px 12px;
        font-size: 1.1rem;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <h1>Weather App</h1>
      <div class="search-row">
        <input id="q" type="text" placeholder="Enter city" aria-label="City name" />
        <button onclick="go()">Search</button>
      </div>
      <div id="o" aria-live="polite"></div>
    </div>

    <script>
      const q = document.getElementById('q');
      const o = document.getElementById('o');

      q.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') go();
      });

      async function go() {
        const city = q.value.trim();
        if (!city) {
          o.innerHTML = '<div class="status">Please enter a city name.</div>';
          return;
        }

        o.innerHTML = '<div class="status">Loading...</div>';

        try {
          const geoResponse = await fetch(
            'https://geocoding-api.open-meteo.com/v1/search?count=1&name=' + encodeURIComponent(city)
          );
          const geoData = await geoResponse.json();

          if (!geoData.results || geoData.results.length === 0) {
            o.innerHTML = '<div class="status">City not found.</div>';
            return;
          }

          const cityData = geoData.results[0];

          const weatherResponse = await fetch(
            'https://api.open-meteo.com/v1/forecast?latitude=' +
              cityData.latitude +
              '&longitude=' +
              cityData.longitude +
              '&current=temperature_2m,relative_humidity_2m,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=auto'
          );
          const weatherData = await weatherResponse.json();

          const current = weatherData.current;
          const daily = weatherData.daily;

          let html = '<div class="weather-card">';
          html += '<h2 class="city">' + cityData.name + ', ' + cityData.country + '</h2>';
          html += '<h1 class="temp">' + current.temperature_2m + '&deg;C</h1>';
          html += '<p class="meta">Humidity: ' + current.relative_humidity_2m + '% | Wind: ' + current.wind_speed_10m + ' km/h</p>';
          html += '<h3>Forecast</h3>';
          html += '<div class="forecast">';

          for (let i = 0; i < 5; i++) {
            html += '<div class="forecast-item">';
            html += '<span>' + daily.time[i] + '</span>';
            html += '<span>' + daily.temperature_2m_min[i] + '&deg; - ' + daily.temperature_2m_max[i] + '&deg;C</span>';
            html += '</div>';
          }

          html += '</div></div>';
          o.innerHTML = html;
        } catch (error) {
          o.innerHTML = '<div class="status">Network error. Please try again.</div>';
        }
      }
    </script>
  </body>
</html>
