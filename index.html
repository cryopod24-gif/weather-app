<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather App</title>
    <style>
      :root {
        --bg: #eef6ff;
        --bg-2: #dfeeff;
        --panel: rgba(255,255,255,0.82);
        --card: #f3f8ff;
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --text: #152033;
        --muted: #5d6b82;
        --border: #dce8ff;
        --shadow: 0 18px 40px rgba(37,99,235,0.15);
        --button-text: #ffffff;
      }

      body.dark {
        --bg: #0f172a;
        --bg-2: #111827;
        --panel: rgba(15,23,42,0.86);
        --card: #162235;
        --primary: #60a5fa;
        --primary-dark: #3b82f6;
        --text: #ebf3ff;
        --muted: #b7c5dc;
        --border: rgba(148,163,184,0.28);
        --shadow: 0 18px 40px rgba(2,6,23,0.5);
        --button-text: #061220;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 100%);
        color: var(--text);
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 26px 12px;
      }

      .app {
        width: min(92vw, 620px);
        background: var(--panel);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        border-radius: 26px;
        box-shadow: var(--shadow);
        padding: 22px 18px 18px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 2.8rem);
      }

      .toggle {
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.2);
        color: var(--text);
        border-radius: 999px;
        padding: 8px 14px;
        font-weight: 700;
        cursor: pointer;
      }

      .search-row {
        display: flex;
        gap: 10px;
        margin-bottom: 18px;
      }

      input, button {
        font-size: 1rem;
        border-radius: 12px;
      }

      input {
        flex: 1;
        padding: 14px 16px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.5);
        color: var(--text);
        outline: none;
      }

      input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(37,99,235,0.12);
      }

      button {
        border: none;
        background: var(--primary);
        color: var(--button-text);
        padding: 14px 18px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, background 0.2s ease;
      }

      button:hover {
        background: var(--primary-dark);
        transform: translateY(-1px);
      }

      #o {
        min-height: 240px;
      }

      .weather-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 18px 18px 12px;
      }

      .city {
        margin: 0;
        font-size: clamp(1.4rem, 4vw, 2rem);
      }

      .temp-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin: 14px 0 10px;
      }

      .temp {
        margin: 0;
        font-size: clamp(2.9rem, 8vw, 4.2rem);
        line-height: 1;
      }

      .icon {
        font-size: clamp(2.3rem, 6vw, 3.8rem);
      }

      .meta {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 0.98rem;
      }

      .forecast {
        display: grid;
        gap: 8px;
      }

      .forecast-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(255,255,255,0.25);
        border: 1px solid rgba(148,163,184,0.25);
        border-radius: 10px;
        padding: 10px 12px;
      }

      .forecast-item span:last-child {
        font-weight: 700;
      }

      .status {
        padding: 28px 10px;
        text-align: center;
        color: var(--muted);
        font-size: 1.05rem;
      }

      @media (max-width: 480px) {
        .search-row {
          flex-direction: column;
        }

        .topbar {
          align-items: flex-start;
        }

        .toggle {
          align-self: flex-end;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <h1>Weather App</h1>
        <button class="toggle" id="themeToggle" type="button">Dark mode</button>
      </div>

      <div class="search-row">
        <input id="q" type="text" placeholder="Enter city" aria-label="City name" />
        <button onclick="go()" type="button">Search</button>
      </div>

      <div id="o" aria-live="polite"></div>
    </div>

    <script>
      const q = document.getElementById('q');
      const o = document.getElementById('o');
      const themeToggle = document.getElementById('themeToggle');

      const weatherCodes = {
        0: { label: 'Clear sky', icon: '☀️' },
        1: { label: 'Mainly clear', icon: '🌤️' },
        2: { label: 'Partly cloudy', icon: '⛅' },
        3: { label: 'Overcast', icon: '☁️' },
        45: { label: 'Fog', icon: '🌫️' },
        48: { label: 'Depositing rime fog', icon: '🌫️' },
        51: { label: 'Light drizzle', icon: '🌦️' },
        53: { label: 'Moderate drizzle', icon: '🌦️' },
        55: { label: 'Dense drizzle', icon: '🌧️' },
        56: { label: 'Light freezing drizzle', icon: '🌧️' },
        57: { label: 'Dense freezing drizzle', icon: '🌧️' },
        61: { label: 'Slight rain', icon: '🌦️' },
        63: { label: 'Moderate rain', icon: '🌧️' },
        65: { label: 'Heavy rain', icon: '🌧️' },
        66: { label: 'Freezing rain', icon: '🌧️' },
        67: { label: 'Heavy freezing rain', icon: '🌧️' },
        71: { label: 'Slight snow', icon: '🌨️' },
        73: { label: 'Moderate snow', icon: '❄️' },
        75: { label: 'Heavy snow', icon: '❄️' },
        77: { label: 'Snow grains', icon: '❄️' },
        80: { label: 'Rain showers', icon: '🌦️' },
        81: { label: 'Heavy rain showers', icon: '🌧️' },
        82: { label: 'Violent rain showers', icon: '⛈️' },
        85: { label: 'Snow showers', icon: '🌨️' },
        86: { label: 'Heavy snow showers', icon: '❄️' },
        95: { label: 'Thunderstorm', icon: '⛈️' },
        96: { label: 'Thunderstorm with hail', icon: '⛈️' },
        99: { label: 'Heavy thunderstorm with hail', icon: '⛈️' }
      };

      const savedTheme = localStorage.getItem('weatherAppTheme');
      if (savedTheme === 'dark') {
        document.body.classList.add('dark');
        themeToggle.textContent = 'Light mode';
      }

      themeToggle.addEventListener('click', () => {
        const dark = document.body.classList.toggle('dark');
        themeToggle.textContent = dark ? 'Light mode' : 'Dark mode';
        localStorage.setItem('weatherAppTheme', dark ? 'dark' : 'light');
      });

      q.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') go();
      });

      async function go() {
        const city = q.value.trim();
        if (!city) {
          o.innerHTML = '<div class="status">Please enter a city name.</div>';
          return;
        }

        o.innerHTML = '<div class="status">Loading...</div>';

        try {
          const geoResponse = await fetch(
            'https://geocoding-api.open-meteo.com/v1/search?count=1&name=' + encodeURIComponent(city)
          );
          const geoData = await geoResponse.json();

          if (!geoData.results || geoData.results.length === 0) {
            o.innerHTML = '<div class="status">City not found.</div>';
            return;
          }

          const cityData = geoData.results[0];
          const weatherResponse = await fetch(
            'https://api.open-meteo.com/v1/forecast?latitude=' +
              cityData.latitude +
              '&longitude=' +
              cityData.longitude +
              '&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code,time&timezone=auto&forecast_days=7'
          );
          const weatherData = await weatherResponse.json();

          const current = weatherData.current;
          const daily = weatherData.daily;
          const currentCondition = weatherCodes[current.weather_code] || { label: 'Weather', icon: '🌤️' };

          let html = '<div class="weather-card">';
          html += '<h2 class="city">' + cityData.name + ', ' + cityData.country + '</h2>';
          html += '<div class="temp-row">';
          html += '<div><h1 class="temp">' + current.temperature_2m + '&deg;C</h1></div>';
          html += '<div class="icon" aria-label="' + currentCondition.label + '">' + currentCondition.icon + '</div>';
          html += '</div>';
          html += '<p class="meta">' + currentCondition.label + ' • Humidity: ' + current.relative_humidity_2m + '% • Wind: ' + current.wind_speed_10m + ' km/h</p>';
          html += '<h3>7-Day Forecast</h3>';
          html += '<div class="forecast">';

          for (let i = 0; i < 7; i++) {
            const dailyCondition = weatherCodes[daily.weather_code[i]] || { icon: '🌤️' };
            html += '<div class="forecast-item">';
            html += '<span>' + daily.time[i] + '</span>';
            html += '<span>' + dailyCondition.icon + ' ' + daily.temperature_2m_min[i] + '&deg; - ' + daily.temperature_2m_max[i] + '&deg;C</span>';
            html += '</div>';
          }

          html += '</div></div>';
          o.innerHTML = html;
        } catch (error) {
          o.innerHTML = '<div class="status">Network error. Please try again.</div>';
        }
      }
    </script>
  </body>
</html>
